name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile bank_mgmt.cpp
        run: g++ -std=c++17 -Wall -Wextra bank_mgmt.cpp -o bank_mgmt

      - name: Run the program once with no input
        run: echo "" | ./bank_mgmt || true
