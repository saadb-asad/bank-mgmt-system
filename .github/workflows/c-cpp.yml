name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile bank_system.cpp
        run: g++ -std=c++17 -Wall -Wextra code/bank_system.cpp -o bank_system

      - name: Run the program once with no input
        run: echo "" | ./bank_system || true
